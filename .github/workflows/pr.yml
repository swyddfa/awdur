name: 'PR: awdur'
on:
  pull_request:
    branches:
    - develop
    - release
    paths:
    - 'lib/awdur/**'
    - '!lib/awdur/changes/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  #v10.2.0

    - run: |
        set -e
        uv tool install -p 3.14 hatch
        uv tool install -p 3.14 towncrier
        uv run -p 3.14 python ./scripts/make_release.py awdur
      name: Set Version

    - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5  # v3.0.1
      id: baipp
      with:
        path: lib/awdur

    outputs:
      python-versions: ${{ steps.baipp.outputs.supported_python_classifiers_json_array }}

  test:
    needs: build
    name: "Python v${{ matrix.python-version }} -- ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.build.outputs.python-versions) }}
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      id: uv
      with:
        python-version: ${{ matrix.python-version }}

    - run: |
        sudo apt install fossil
        uv tool install hatch
      name: Install dependencies

    - run: |
        make -C lib/awdur test
      name: Run Tests
      env:
        ARGS: '-py=${{ steps.uv.outputs.python-version }} --cover'
