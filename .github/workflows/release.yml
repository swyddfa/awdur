name: 'Release: awdur'
on:
  push:
    branches:
    - release
    paths:
    - 'lib/awdur/**'

permissions: {}

jobs:
  release:
    name: awdur release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/awdur
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: true  # needed to push commits to the release branch

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.12"

    - run: |
        python --version
        python -m pip install --upgrade pip
        python -m pip install --upgrade build hatch towncrier docutils
      name: Setup Environment

    - run: |
        set -e

        ./scripts/make_release.py awdur
      name: Set Version
      id: info

    - name: Package
      run: |
        cd lib/awdur
        python -m build

    - name: 'Upload Artifact'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: 'dist'
        path: lib/awdur/dist

    - name: Publish
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
      with:
        packages-dir: lib/awdur/dist/

    - name: Create Release
      run: |
        gh release create "${RELEASE_TAG}" \
          --title "Awdur v${VERSION} - ${RELEASE_DATE}" \
          -F lib/awdur/.changes.md \
          ./lib/awdur/dist/*
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
